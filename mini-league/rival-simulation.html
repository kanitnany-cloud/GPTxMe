<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FPL Rival Simulation</title><style>
:root{--bg:#08111f;--card:#101d30;--line:#263750;--text:#eaf1fb;--muted:#9eb0c7;--accent:#59d0b5;--warn:#ffcb6b}*{box-sizing:border-box}body{margin:0;background:linear-gradient(135deg,#08111f,#10233a);color:var(--text);font:15px system-ui,-apple-system,Segoe UI,sans-serif}main{max-width:1240px;margin:auto;padding:28px 18px 60px}h1{margin:0 0 6px;font-size:30px}h2{margin:28px 0 12px;font-size:20px}.sub,.muted{color:var(--muted)}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}.card{background:rgba(16,29,48,.92);border:1px solid var(--line);border-radius:14px;padding:15px;box-shadow:0 10px 28px #0002}.metric{font-size:28px;font-weight:750;margin-top:6px}.tag{display:inline-block;border-radius:999px;padding:3px 9px;background:#173b4c;color:var(--accent);font-size:12px}.warn{color:var(--warn)}table{width:100%;border-collapse:collapse;background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden}th,td{text-align:left;padding:10px;border-bottom:1px solid var(--line);vertical-align:top}th{color:var(--muted);font-size:12px;text-transform:uppercase}tr:last-child td{border:0}.profile{font-weight:700}.bar{height:7px;background:#1b2c43;border-radius:99px;margin-top:7px}.bar i{display:block;height:100%;border-radius:99px;background:var(--accent)}details{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin:8px 0}summary{cursor:pointer;font-weight:700}.small{font-size:13px}.pill{margin:2px 3px 2px 0;display:inline-block;background:#172942;border-radius:8px;padding:4px 7px}.footer{margin-top:30px;color:var(--muted);font-size:12px}@media(max-width:650px){th:nth-child(n+5),td:nth-child(n+5){display:none}}
</style></head><body><main><div id="app"><p>กำลังโหลดข้อมูลจำลอง...</p></div></main><script>
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
fetch('./rival-simulation.json?ts='+Date.now()).then(r=>r.json()).then(d=>{const rivals=d.rivals||[];const me=rivals.find(x=>x.entry===3944270);const leader=rivals[0];const avgPts=Math.round(rivals.reduce((a,x)=>a+(x.total||0),0)/Math.max(1,rivals.length));document.title=`Rival Simulation GW${d.nextEvent}`;document.querySelector('#app').innerHTML=`
<h1>Rival Behaviour Simulation</h1><div class="sub">GW${d.currentEvent} actual → GW${d.nextEvent} forecast · อัปเดต ${esc(d.generatedAt)} · model ${esc(d.modelVersion)}</div>
<div class="grid" style="margin-top:18px"><div class="card"><div class="muted">อันดับ 1</div><div class="metric">${esc(leader?.team)}</div><div class="small">${leader?.total??'-'} แต้ม · ${leader?.simulated?.action==='likely_transfer'?'มีแนวโน้มเปลี่ยนตัว':'มีแนวโน้ม roll FT'}</div></div><div class="card"><div class="muted">Kanitnan</div><div class="metric">${me?.rank??'-'}</div><div class="small">${me?.total??'-'} แต้ม · gap ${me&&leader?leader.total-me.total:'-'}</div></div><div class="card"><div class="muted">ค่าเฉลี่ยคะแนนทีม top 10</div><div class="metric">${avgPts}</div><div class="small">ข้อมูลจาก mini-league snapshot</div></div><div class="card"><div class="muted">สถานะข้อมูล</div><div class="metric">GW${d.currentEvent}</div><div class="small">${d.currentStatus.finished?'จบแล้ว':'ยังไม่จบ'} · deadline ถัดไป ${esc(d.currentStatus.deadline||'-')}</div></div></div>
<h2>Forecast ของคู่แข่งรายคน</h2><div class="grid">${rivals.map(x=>`<div class="card"><div class="profile">#${x.rank} ${esc(x.team)}</div><div class="small muted">${esc(x.name)} · ${x.total} แต้ม</div><p><span class="tag">${esc(x.simulated.action)}</span> <span class="tag">${esc(x.simulated.confidence)}</span></p><div class="small">transfer pressure ${x.simulated.transferPressure}%</div><div class="bar"><i style="width:${x.simulated.transferPressure}%"></i></div><p class="small">${esc(x.simulated.reason)}</p><p class="small">กัปตันล่าสุด: <b>${esc(x.current.captain||'-')}</b></p></div>`).join('')}</div>
<h2>Owner + Captain Matrix · last revealed</h2><table><thead><tr><th>ทีม</th><th>กัปตัน</th><th>Transfer rate</th><th>Avg moves</th><th>Hit rate</th><th>Profile</th></tr></thead><tbody>${rivals.map(x=>`<tr><td>#${x.rank} ${esc(x.team)}</td><td>${esc(x.current.captain||'-')} ×${x.current.captainMultiplier||1}</td><td>${x.profile.transferRate}%</td><td>${x.profile.avgMoves}</td><td>${x.profile.hitRate}%</td><td>${x.profile.sampleGWs} GW · ${x.profile.captainHaalandRate}% Haaland captain</td></tr>`).join('')}</tbody></table>
<h2>จำลองผู้เล่นที่อาจถูกดึงเข้า</h2>${rivals.map(x=>`<details><summary>#${x.rank} ${esc(x.team)} · ${esc(x.simulated.action)}</summary><p class="small">${x.simulated.candidates.map(p=>`<span class="pill">${esc(p.player)} · ${esc(p.club)} · £${p.price} · form ${p.form} · owner ${p.globalOwner}%</span>`).join('')}</p></details>`).join('')}
<h2>Learning loop</h2><div class="card small">หลัง GW เริ่ม/จบ ให้บันทึก action, captain, player inclusion และ points gap ที่เกิดขึ้นจริง แล้วเทียบกับ forecast เดิม ห้ามแก้ forecast ย้อนหลัง ให้เพิ่ม model version และปรับน้ำหนักเมื่อมีหลาย GW รองรับ</div><div class="footer">ข้อมูลจริงจาก FPL public API · Forecast เป็น inference ไม่ใช่ข้อมูล transfer ที่ยังไม่เปิดเผย · <a style="color:var(--accent)" href="./rival-simulation.json">เปิด JSON</a></div>`}).catch(e=>document.querySelector('#app').innerHTML='<div class="card">โหลดข้อมูลไม่สำเร็จ: '+esc(e.message)+'</div>');
</script></body></html>
