name: Update FPL Mini League

on:
  workflow_dispatch:
  schedule:
    - cron: '*/30 * * * *'

permissions:
  contents: write

concurrency:
  group: fpl-data-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Refresh FPL data
        run: |
          node scripts/update-fpl-mini-league.mjs
          node scripts/collect-current-intel.mjs
          node scripts/sync-fpl-current.mjs

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html api/*.json mini-league/*.html mini-league/*.json mini-league/*.csv daily-dashboard/*.html daily-dashboard/*.json daily-dashboard/*.csv
          if git diff --cached --quiet; then
            echo "No FPL data changes to commit."
          else
            git commit -m "Refresh FPL mini league data"
            git push
          fi
