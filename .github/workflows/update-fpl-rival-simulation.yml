name: Update FPL rival simulation

on:
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build rival simulation
        run: node scripts/build-fpl-rival-simulation.mjs
      - name: Commit changed simulation snapshot
        run: |
          if git diff --quiet -- mini-league/rival-simulation.json; then
            echo "No simulation change"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mini-league/rival-simulation.json
          git commit -m "Update FPL rival simulation"
          git push
