name: Update FPL mini-league data

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fpl-data-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out site
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Update FPL data
        run: |
          node scripts/update-fpl-mini-league.mjs
          node scripts/collect-current-intel.mjs
          node scripts/sync-fpl-current.mjs

      - name: Commit changed data
        run: |
          git add index.html api/*.json mini-league/*.html mini-league/*.json mini-league/*.csv daily-dashboard/*.html daily-dashboard/*.json daily-dashboard/*.csv
          if git diff --cached --quiet; then
            echo "No FPL data changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update FPL mini-league data"
          git push
