name: Update FPL mini-league data

on:
  workflow_dispatch:
  schedule:
    - cron: '*/30 * * * *'

permissions:
  contents: write

concurrency:
  group: fpl-data-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out site
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Update FPL data
        run: node scripts/update-fpl-mini-league.mjs

      - name: Commit changed data
        run: |
          if git diff --quiet -- mini-league/mini-league-intel-gw1.json mini-league/team-summary-gw1.csv mini-league/player-template-gw1.csv api/fpl-device-live.json; then
            echo "No FPL data changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mini-league/mini-league-intel-gw1.json mini-league/team-summary-gw1.csv mini-league/player-template-gw1.csv api/fpl-device-live.json
          git commit -m "Update FPL mini-league data"
          git push
